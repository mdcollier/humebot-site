<text x="722" y="103" class="t label" text-anchor="middle">API (proposed)</text>
<text x="722" y="124" class="t tiny" text-anchor="middle">external provider · TLS</text>
<text x="722" y="138" class="t tiny" text-anchor="middle">receives the question text</text>
<text x="722" y="152" class="t tiny" text-anchor="middle">and the corpus evidence;</text>
<text x="722" y="166" class="t tiny" text-anchor="middle">never a student identity</text>
<text x="722" y="180" class="t tiny" text-anchor="middle">frozen settings; served</text>
<text x="722" y="194" class="t tiny" text-anchor="middle">model checked against pin</text>
