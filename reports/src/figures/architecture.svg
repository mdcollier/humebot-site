<text x="362" y="448" class="t tiny" text-anchor="start">both hash-pinned at release</text>
<text x="362" y="462" class="t tiny" text-anchor="start">no model weights · no student data</text>
<rect x="636" y="60" width="172" height="152" rx="6" class="dashed"/>
