<text x="239" y="158" class="t tiny" text-anchor="middle">authenticating proxy</text>
<text x="239" y="171" class="t tiny" text-anchor="middle">one identity header;</text>
<text x="239" y="184" class="t tiny" text-anchor="middle">client copies stripped</text>
