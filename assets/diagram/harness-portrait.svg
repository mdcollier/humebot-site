  .hbd-ink { fill: var(--ink, #1b1e23); }
  .hbd-muted { fill: var(--muted, #4b5260); }
  .hbd-acc-s { stroke: var(--accent, #1f3a56); }
  .hbd-acc-f { fill: var(--accent, #1f3a56); }
  .hbd-gold-s { stroke: var(--gold, #b8862b); }
  .hbd-gold-f { fill: var(--gold, #b8862b); }
  .hbd-rule-s { stroke: var(--rule, #dad6cc); }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  .hbd-serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, serif; }
  .hbd-t-title { font-size: 22px; font-weight: 700; }
  .hbd-t-label { font-size: 17px; font-weight: 600; }
  .hbd-t-stage { font-size: 16px; font-weight: 600; }
  .hbd-t-small { font-size: 13px; }
  .hbd-t-rule { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
  .hbd-flow { fill: none; stroke-width: 2.5; }
  .hbd-flow-thin { fill: none; stroke-width: 2; }
  .hbd-govern { fill: none; stroke-width: 2.5; stroke-dasharray: 7 6; }
  .hbd-frame { fill: none; stroke-width: 3.5; }
  .hbd-frame-in { fill: none; stroke-width: 1.2; }
</style>
