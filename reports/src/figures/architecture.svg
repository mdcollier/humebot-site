<text x="722" y="369" class="t label" text-anchor="middle">(proposed)</text>
<text x="722" y="390" class="t tiny" text-anchor="middle">TLS required</text>
<text x="722" y="404" class="t tiny" text-anchor="middle">schemas: ops · instr · research</text>
