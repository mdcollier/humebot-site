<text x="475.0" y="66" class="t title burg" text-anchor="middle">Reading Desk application</text>
<text x="475.0" y="84" class="t tiny" text-anchor="middle">one container image · non-root · read-only filesystem</text>
<rect x="350" y="96" width="250" height="84" rx="6" class="proc"/>
<text x="362" y="118" class="t label" text-anchor="start">web</text>
<text x="362" y="136" class="t tiny" text-anchor="start">Django · gunicorn · port 8000</text>
<text x="362" y="150" class="t tiny" text-anchor="start">pages, questions, Evidence Inspector</text>
<text x="362" y="164" class="t tiny" text-anchor="start">/healthz · /readyz</text>
